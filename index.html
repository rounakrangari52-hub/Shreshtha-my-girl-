<!DOCTYPE html>
<html>
<head>
<title>For My Love ❤️</title>

<style>
body{
    margin:0;
    font-family: Arial;
    text-align:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
    color:white;
}

/* password screen */
#lock{
    position:fixed;
    width:100%;
    height:100vh;
    background:#ff6b81;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:10px;
    border:none;
    margin-top:10px;
}

button{
    padding:12px 25px;
    margin-top:15px;
    border:none;
    border-radius:20px;
    font-size:18px;
    background:red;
    color:white;
}

/* main content */
#main{
    display:none;
    padding-top:30px;
}

/* slideshow */
#slider{
    width:200px;
    height:200px;
    margin:auto;
}

#slider img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
}

/* typing text */
#typing{
    margin-top:20px;
    font-size:20px;
    width:85%;
    margin-left:auto;
    margin-right:auto;
}

/* hearts */
.heart{
    position:absolute;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lock">
<h2>Enter Password ❤️</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="unlock()">Open</button>
</div>


<!-- MAIN WEBSITE -->
<div id="main">

<h1>Hi My Love ❤️</h1>

<div id="slider">
<img id="slideImg" src="IMG_20260216_220328.jpg">
</div>

<p id="typing"></p>

</div>


<script>
/* PASSWORD */
function unlock(){
    if(document.getElementById("pass").value === "iloveyou"){
        document.getElementById("lock").style.display="none";
        document.getElementById("main").style.display="block";
    } else {
        alert("Wrong password 😜");
    }
}

/* SLIDESHOW */
let images = [
"IMG_20260216_220328.jpg",
"Videoshot_20260208_132619.jpg"
];

let i=0;
setInterval(()=>{
    i=(i+1)%images.length;
    document.getElementById("slideImg").src=images[i];
},2000);


/* TYPING ANIMATION */
let text="You are my happiness my peace my smile and my forever I love you more than anything in this world ❤️";
let j=0;

function type(){
    if(j<text.length){
        document.getElementById("typing").innerHTML += text.charAt(j);
        j++;
        setTimeout(type,50);
    }
}
type();


/* HEARTS */
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
},300);
</script>

</body>
</html>
